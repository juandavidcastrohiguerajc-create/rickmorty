# Configuración de Gradle para todo el proyecto.
# Usuarios del IDE (p. ej. Android Studio):
# La configuración de Gradle hecha desde el IDE *tiene prioridad*
# sobre cualquier valor definido en este archivo.
# Para más detalles sobre cómo configurar el entorno de compilación visita
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Define los argumentos JVM para el proceso demonio (daemon).
# Este ajuste es especialmente útil para modificar la memoria.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Cuando está activo, Gradle corre en modo paralelo.
# Esta opción solo debe usarse con proyectos desacoplados. Para más detalles, visita
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Cuando está activa, la caché de configuración permite a Gradle omitir por completo
# la fase de configuración si nada que afecte la compilación (como los scripts)
# ha cambiado. Además, Gradle aplica optimizaciones de rendimiento a las tareas.
org.gradle.configuration-cache=true
# Estilo de código Kotlin de este proyecto: "official" u "obsolete":
kotlin.code.style=official
